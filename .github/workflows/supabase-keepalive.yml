name: Supabase Keepalive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY GitHub secrets."
            exit 1
          fi

          BASE_URL="${SUPABASE_URL%/}"
          KEEPALIVE_URL="${BASE_URL}/rest/v1/bookings?select=date&limit=1"

          STATUS_CODE=$(curl -sS -o /tmp/keepalive-response.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${KEEPALIVE_URL}")

          echo "HTTP status: ${STATUS_CODE}"
          cat /tmp/keepalive-response.json

          if [ "${STATUS_CODE}" -lt 200 ] || [ "${STATUS_CODE}" -ge 300 ]; then
            echo "Keepalive failed."
            exit 1
          fi
